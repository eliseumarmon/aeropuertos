name: slim_aeropuertos
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./src:/var/www
      - ./docker/php/conf.d/99-xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini
    env_file: ./docker/php/php.env
    depends_on:
      - mysql

  phpmyadmin:
    image: phpmyadmin:5-fpm
    environment:
      PMA_HOST: mysql
    volumes:
      - pma_source:/var/www/html
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8081:8081"
    volumes:
      - ./src/public:/var/www/public:ro
      - ./src/logs:/var/log/nginx
      - pma_source:/var/www/phpmyadmin
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - phpmyadmin

  mysql:
    image: mysql:8.0
    env_file: ./docker/mysql/mysql.env
    volumes:
      - ./docker/mysql/database:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

networks:
  default:
    driver: bridge

volumes:
  mysql_data:
  pma_source: